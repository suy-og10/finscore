{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center py-16">
  <div class="bg-white shadow-xl p-8 rounded-xl w-full max-w-md">
    <h2 class="text-2xl font-bold text-indigo-700 mb-6 text-center">Create Account</h2>
    <form method="POST">
      <input name="username" placeholder="Username" class="w-full mb-4 p-3 border rounded-lg">
      <input name="password" type="password" placeholder="Password" class="w-full mb-4 p-3 border rounded-lg">
      <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg">Register</button>
    </form>
    <p class="text-gray-500 text-center mt-4">Already have an account? 
      <a href="/login" class="text-indigo-600 hover:underline">Login</a>
    </p>
  </div>
</div>
{% endblock %}
