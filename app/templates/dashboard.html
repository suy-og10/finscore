{% extends "base.html" %}
{% block content %}
<div class="py-10 px-6 flex justify-center">
  <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-5xl">
    <h1 class="text-3xl font-bold text-indigo-700 mb-4 text-center">Credit Scoring Dashboard</h1>
    <div class="grid grid-cols-3 gap-4 mb-8">
      <div class="bg-green-100 text-green-700 rounded-lg p-4 text-center">
        <h2 class="text-xl font-semibold">Good</h2>
        <p class="text-3xl font-bold">{{ summary['Good'] }}</p>
      </div>
      <div class="bg-yellow-100 text-yellow-700 rounded-lg p-4 text-center">
        <h2 class="text-xl font-semibold">Average</h2>
        <p class="text-3xl font-bold">{{ summary['Average'] }}</p>
      </div>
      <div class="bg-red-100 text-red-700 rounded-lg p-4 text-center">
        <h2 class="text-xl font-semibold">Poor</h2>
        <p class="text-3xl font-bold">{{ summary['Poor'] }}</p>
      </div>
    </div>

    <div class="flex flex-col md:flex-row justify-between gap-6">
      <div class="bg-gray-50 p-4 rounded-xl w-full md:w-1/2 shadow">
        <h3 class="text-lg font-semibold mb-3 text-gray-700">Feature Importance</h3>
        <canvas id="featureChart"></canvas>
      </div>
      <div class="bg-gray-50 p-4 rounded-xl w-full md:w-1/2 shadow">
        <h3 class="text-lg font-semibold mb-3 text-gray-700">Predictions Overview</h3>
        <canvas id="summaryChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
  // feature_importance.json may contain { feature_importance: {...}, accuracy: x }
  const raw = {{ importance|tojson }};
  const features = raw.feature_importance ? raw.feature_importance : raw;
  const labels = Object.keys(features);
  const values = Object.values(features);
  new Chart(document.getElementById('featureChart'), { type: 'bar', data: { labels, datasets: [{ label: 'Importance', data: values, backgroundColor: '#6366f1' }] } });
  new Chart(document.getElementById('summaryChart'), {
    type: 'pie',
    data: { labels: ['Good','Average','Poor'], datasets: [{ data: [{{ summary['Good'] }},{{ summary['Average'] }},{{ summary['Poor'] }}], backgroundColor: ['#22c55e','#eab308','#ef4444'] }] }
  });
</script>
{% endblock %}
